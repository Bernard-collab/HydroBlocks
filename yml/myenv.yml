name: HBnew_glibc228
channels:
  - conda-forge
dependencies:
  # Compiler + OpenMP
  - python=3.10
  - gcc=10
  - gfortran=10
  - libgomp
  - _libgcc_mutex
  - _openmp_mutex

  # Core Python packages
  - numpy=1.21
  - scipy=1.9
  - pandas=1.4
  - scikit-learn
  - xarray
  - h5py=3.6
  - mpi4py  # works with system MPI, but no parallel NetCDF I/O
  - netcdf4=1.5.8  # will use serial HDF5 backend
  - cftime=1.6.0
  - importlib-metadata=4.11.4
  - llvmlite=0.38.0
  - numba=0.55.1
  - psutil=5.9.4
  - pytz=2021.3
  - setuptools=59.8.0
  - pip=22.0.3
  - wheel=0.37.1

  # Geospatial packages
  - affine=2.3.0
  - attrs=21.4.0
  - fiona=1.8.21
  - geopandas=0.10.2
  - gdal=3.4.1
  - pyproj=3.3.0
  - rasterio=1.2.10
  - shapely=1.8.0

  # System libraries
  - hdf5=1.12.1=nompi
  - libnetcdf=4.8.1=nompi
  - libblas
  - libcblas
  - liblapack
  - libzlib
  - libpng
  - zlib
  - libjpeg-turbo
  - freetype
  - libtiff
  - libxml2
  - libffi
  - openssl
  - curl

  # Fonts & Xorg (optional, for plotting or GUI tools)
  - fontconfig
  - freetype
  - libxrender
  - libxext
  - libx11
  - pixman
  - cairo
  - tk
